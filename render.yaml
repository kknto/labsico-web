services:
  - type: web
    name: labsico-web
    runtime: node
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    domains:
      - labsico.tech
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_LABSICO_WHATSAPP
        value: "5219982134937"
      - key: NEXT_PUBLIC_LABSICO_EMAIL
        value: "contacto@labsico.mx"
      - key: NEXT_PUBLIC_LABSICO_PHONE
        value: "+52 1 998-213-4937"
      - key: NEXT_PUBLIC_LABSICO_ADDRESS
        value: "C. 6 99, 77536 Cancun, Q.R. Plus Code 44V9+QX Cancun, Quintana Roo"
      - key: NEXT_PUBLIC_LABSICO_MAP_URL
        value: "https://www.google.com/maps/search/?api=1&query=C.%206%2099%2C%2077536%20Cancun%2C%20Q.R.%2044V9%2BQX%20Cancun%2C%20Quintana%20Roo"
      - key: INTERNAL_ACCESS_CODE
        sync: false
      - key: INTERNAL_ACCESS_SECRET
        generateValue: true
      - key: INTERNAL_COOKIE_SECURE
        value: "true"
      - key: INTERNAL_REPORTES_URL
        value: "https://reportes-seybaplaya.onrender.com"
      - key: INTERNAL_SLIPFORM_URL
        value: "https://deslizados-labsico.onrender.com"
      - key: INTERNAL_GESTION_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: QUOTE_TO_EMAIL
        value: "contacto@labsico.mx"
